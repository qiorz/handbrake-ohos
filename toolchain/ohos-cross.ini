# Meson cross file TEMPLATE for OHOS arm64 (Linux/macOS host).
# Placeholders @OHOS_NDK@ and @HBROOT@ must be substituted before use, e.g.:
#   OHOS_NDK=<sdk>/default/openharmony/native HBROOT=$PWD \
#     envsubst < toolchain/ohos-cross.ini > /tmp/ohos-cross.ini
[binaries]
c = '@HBROOT@/toolchain/aarch64-ohos-cc'
cpp = '@HBROOT@/toolchain/aarch64-ohos-cxx'
ar = '@OHOS_NDK@/llvm/bin/llvm-ar'
strip = '@OHOS_NDK@/llvm/bin/llvm-strip'
ranlib = '@OHOS_NDK@/llvm/bin/llvm-ranlib'
pkgconfig = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[properties]
needs_exe_wrapper = true
pkg_config_libdir = '@HBROOT@/out/ohos-arm64/lib/pkgconfig'
