# CMake toolchain file for OHOS arm64. Requires: export HBROOT=<repo root>
#   cmake -DCMAKE_TOOLCHAIN_FILE=toolchain/ohos-cmake.ini ...
set(CMAKE_SYSTEM_NAME Linux)
set(CMAKE_SYSTEM_PROCESSOR aarch64)
set(CMAKE_C_COMPILER $ENV{HBROOT}/toolchain/aarch64-ohos-cc)
set(CMAKE_CXX_COMPILER $ENV{HBROOT}/toolchain/aarch64-ohos-cxx)
set(CMAKE_AR $ENV{OHOS_NDK}/llvm/bin/llvm-ar)
set(CMAKE_RANLIB $ENV{OHOS_NDK}/llvm/bin/llvm-ranlib)
set(CMAKE_FIND_ROOT_PATH $ENV{HBROOT}/out/ohos-arm64)
set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
